<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AccessAble - Smart Assistant</title>
    
    <!-- 1. Tailwind Script (Using the official Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. Allow Camera/Mic permissions in the Browser Header -->
    <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, geolocation=*">

    <style>
      /* Fallback if Tailwind fails to load */
      body { background-color: #000; color: #fff; margin: 0; font-family: sans-serif; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
